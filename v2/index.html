<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats</title>
<style>body { background: #0b0c14; color: #cbd5e1; font: 15px system-ui, sans-serif; padding: 24px; }</style>
</head>
<body>
<p>Stats moved to the main address. <a href="../" style="color:#67e8f9">Open it</a>.</p>
<script>
// v2 became the main app on 12.11: drop the old /v2/ service worker, then go to the main address (keeps ?api= for local tests)
(async () => {
  try { for (const r of await navigator.serviceWorker.getRegistrations()) if (new URL(r.scope).pathname.endsWith('/v2/')) await r.unregister(); } catch { /* none */ }
  location.replace('../' + location.search);
})();
</script>
</body>
</html>
